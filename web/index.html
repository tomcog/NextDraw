<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextDraw Plot</title>
    <!-- Add to Home Screen: opens full screen, like an app, on an iPad or phone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NextDraw" />
    <!-- Lucide waypoints, the mark Plot carries in the app switch. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d6322b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m10.586 5.414-5.172 5.172'/%3E%3Cpath d='m18.586 13.414-5.172 5.172'/%3E%3Cpath d='M6 12h12'/%3E%3Ccircle cx='12' cy='20' r='2'/%3E%3Ccircle cx='12' cy='4' r='2'/%3E%3Ccircle cx='20' cy='12' r='2'/%3E%3Ccircle cx='4' cy='12' r='2'/%3E%3C/svg%3E" />
    <script>
      // The theme the switch in the header last set, applied before the first paint so there is no
      // flash of the wrong one. Light unless dark was chosen. Keep in step with src/lib/theme.ts.
      (function () {
        var chosen = "light";
        try { if (localStorage.getItem("nextdraw-theme") === "dark") chosen = "dark"; } catch (e) {}
        document.documentElement.dataset.theme = chosen;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/plot/main.tsx"></script>
  </body>
</html>
