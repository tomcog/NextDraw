<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextDraw Studio</title>
    <!-- Add to Home Screen: opens full screen, like an app, on an iPad or phone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NextDraw" />
    <!-- A drawn square rather than Plot's pen nib, so the two tabs tell themselves apart. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2.5' y='2.5' width='11' height='11' fill='none' stroke='%23d6322b' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      // Follow the system light/dark setting using the component library's data-theme switch.
      (function () {
        var q = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () { document.documentElement.dataset.theme = q.matches ? "dark" : "light"; };
        apply();
        q.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studio/main.tsx"></script>
  </body>
</html>
