<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextDraw Studio</title>
    <!-- Add to Home Screen: opens full screen, like an app, on an iPad or phone. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NextDraw" />
    <!-- Lucide spline-pointer, the mark Studio carries in its title and the app switch. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d6322b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12.034 12.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z'/%3E%3Cpath d='M5 17A12 12 0 0 1 17 5'/%3E%3Ccircle cx='19' cy='5' r='2'/%3E%3Ccircle cx='5' cy='19' r='2'/%3E%3C/svg%3E" />
    <script>
      // The theme the switch in the header last set, applied before the first paint so there is no
      // flash of the wrong one. Light unless dark was chosen. Keep in step with src/lib/theme.ts.
      (function () {
        var chosen = "light";
        try { if (localStorage.getItem("nextdraw-theme") === "dark") chosen = "dark"; } catch (e) {}
        document.documentElement.dataset.theme = chosen;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studio/main.tsx"></script>
  </body>
</html>
